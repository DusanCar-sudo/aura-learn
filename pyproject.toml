[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-learn"
version = "0.1.0"
description = "Continual on-the-job learning for aura-code"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dušan Milosavljević" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch", "transformers", "peft", "trl", "datasets", "pyyaml"]

[project.scripts]
aura-learn = "aura_learn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
